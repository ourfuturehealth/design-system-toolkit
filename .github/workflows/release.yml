name: Create release

# Interim recovery workflow. Changesets publication will make tags an output.
on:
  push:
    tags:
      - "toolkit-v*"
      - "react-v*"

permissions:
  contents: write

concurrency:
  group: design-system-release
  cancel-in-progress: false

jobs:
  build:
    name: Create release
    runs-on: ubuntu-latest
    env:
      CLOUDSMITH_NPM_REGISTRY_TOKEN: ${{ secrets.CLOUDSMITH_NPM_RO_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CLOUDSMITH_NPM_RO_TOKEN }}
        with:
          node-version: "22.x"
          registry-url: ${{ vars.CLOUDSMITH_NPM_URL }}

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate merged tag, version, and release documentation
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISHED_RELEASE_TAGS_FILE: ${{ runner.temp }}/published-release-tags.txt
        run: |
          gh auth setup-git
          git fetch origin main
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.draft == false) | .tag_name' > "${PUBLISHED_RELEASE_TAGS_FILE}"
          node scripts/release/validate-tag-release.mjs "${GITHUB_REF_NAME}" "${GITHUB_SHA}"

      - name: Run linting
        run: pnpm lint && pnpm lint:release

      - name: Install Playwright browser for tests
        run: pnpm --filter=@ourfuturehealth/react-components exec playwright install --with-deps chromium

      - name: Run tests and release documentation checks
        run: pnpm test && pnpm test:release && pnpm docs:release-contract

      - name: Determine package from tag
        id: package_info
        run: |
          if [[ "${GITHUB_REF_NAME}" == react-v* ]]; then
            echo "PACKAGE=react-components" >> "$GITHUB_OUTPUT"
            echo "PACKAGE_DIR=packages/react-components" >> "$GITHUB_OUTPUT"
          else
            echo "PACKAGE=toolkit" >> "$GITHUB_OUTPUT"
            echo "PACKAGE_DIR=packages/toolkit" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare release assets
        id: release_assets
        env:
          PACKAGE: ${{ steps.package_info.outputs.PACKAGE }}
        run: |
          ./scripts/release/prepare-release-artifacts.sh "$PACKAGE" \
            --stage-dir "${RUNNER_TEMP}/release-assets-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${PACKAGE}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify staged package identity and consumer installation
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          PACKAGE_DIR: ${{ steps.package_info.outputs.PACKAGE_DIR }}
          TARBALL: ${{ steps.release_assets.outputs.TARBALL_PATH }}
        run: |
          node scripts/release/validate-artifact-identity.mjs "$PACKAGE_DIR/package.json" "$TARBALL"
          ./scripts/release/smoke-package-tarball.sh --package-dir "$PACKAGE_DIR" --tarball "$TARBALL" --managers yarn,npm,pnpm

      - name: Test compiled toolkit ZIP
        if: steps.package_info.outputs.PACKAGE == 'toolkit'
        env:
          ZIP: ${{ steps.release_assets.outputs.ZIP_PATH }}
        run: node scripts/release/smoke-toolkit-zip.mjs "$ZIP"

      - name: Build isolated React application against staged tarball
        if: steps.package_info.outputs.PACKAGE == 'react-components'
        env:
          TARBALL: ${{ steps.release_assets.outputs.TARBALL_PATH }}
        run: node scripts/release/smoke-react-consumer.mjs "$TARBALL"

      - name: Render reviewed release notes
        id: release_notes
        env:
          PACKAGE: ${{ steps.package_info.outputs.PACKAGE }}
          VERSION: ${{ steps.release_assets.outputs.VERSION }}
          TARBALL_NAME: ${{ steps.release_assets.outputs.TARBALL_NAME }}
          ZIP_NAME: ${{ steps.release_assets.outputs.ZIP_NAME }}
        run: |
          args=(--package "$PACKAGE" --tag "$GITHUB_REF_NAME" --version "$VERSION" --tarball "$TARBALL_NAME" --source-ref "$GITHUB_SHA")
          if [[ "$PACKAGE" == toolkit ]]; then args+=(--zip "$ZIP_NAME"); fi
          ./scripts/release/render-release-notes.sh "${args[@]}" > "${RUNNER_TEMP}/release-notes.md"
          echo "NOTES_PATH=${RUNNER_TEMP}/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Stage draft, verify uploaded assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES_PATH: ${{ steps.release_notes.outputs.NOTES_PATH }}
          TARBALL: ${{ steps.release_assets.outputs.TARBALL_PATH }}
          ZIP: ${{ steps.release_assets.outputs.ZIP_PATH }}
        run: |
          assets=("$TARBALL")
          if [[ -n "$ZIP" ]]; then assets+=("$ZIP"); fi
          node scripts/release/publish-staged-release.mjs "$GITHUB_REF_NAME" "$NOTES_PATH" "${assets[@]}"
