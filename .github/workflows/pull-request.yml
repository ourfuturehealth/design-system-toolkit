name: Pull request

on: pull_request

permissions:
  contents: read

jobs:
  build:
    name: Pull request
    runs-on: ubuntu-latest
    env:
      CLOUDSMITH_NPM_REGISTRY_TOKEN: ${{ secrets.CLOUDSMITH_NPM_RO_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CLOUDSMITH_NPM_RO_TOKEN }}
        with:
          node-version-file: .nvmrc
          registry-url: ${{ vars.CLOUDSMITH_NPM_URL }}

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Read published version history
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[] | select(.draft == false) | .tag_name' > "${RUNNER_TEMP}/published-release-tags.txt"

      - name: Validate feature intent or generated release metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          RELEASE_APP_SLUG: ${{ vars.RELEASE_APP_SLUG }}
          PUBLISHED_RELEASE_TAGS_FILE: ${{ runner.temp }}/published-release-tags.txt
        run: |
          if [ -n "$RELEASE_APP_SLUG" ] && [ "$PR_AUTHOR" = "${RELEASE_APP_SLUG}[bot]" ] && [ "$BASE_BRANCH" = "main" ]; then
            pnpm release:check-pr "$BASE_SHA" "$HEAD_SHA" --release-pr
          else
            pnpm release:check-pr "$BASE_SHA" "$HEAD_SHA"
          fi

      - name: Run linting
        run: pnpm run lint && pnpm lint:release

      - name: Test release metadata guards
        run: pnpm test:release && pnpm docs:release-contract

      - name: Install Playwright browser for tests
        run: pnpm --filter=@ourfuturehealth/react-components exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

      - name: Validate staged external-consumer artifacts
        env:
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: pnpm smoke:release-artifacts
