name: Pull request

on: pull_request

jobs:
  build:
    name: Pull request
    runs-on: ubuntu-latest
    env:
      CLOUDSMITH_NPM_REGISTRY_TOKEN: ${{ secrets.CLOUDSMITH_NPM_RO_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CLOUDSMITH_NPM_RO_TOKEN }}
        with:
          node-version: "22.x"
          registry-url: ${{ vars.CLOUDSMITH_NPM_URL }}

      - name: Enable Corepack and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.29.2 --activate

      - name: Install dependencies
        run: pnpm install

      - name: Validate package release metadata
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/release/validate-package-release-metadata.sh "$BASE_SHA" "$HEAD_SHA"

      - name: Run linting
        run: pnpm run lint

      - name: Install Playwright browser for tests
        run: pnpm --filter=@ourfuturehealth/react-components exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test
